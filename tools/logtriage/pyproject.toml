[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logtriage"
version = "1.0.0"
description = "Authentication log triage with an auditable, testable rule set"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Marcel Koza" }]
keywords = ["security", "soc", "log-analysis", "detection", "mitre-attack", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Environment :: Console",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
logtriage = "logtriage.cli:main"

[tool.setuptools]
packages = ["logtriage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
