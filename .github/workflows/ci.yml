name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: ${{ matrix.tool }} (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [webaudit, logtriage]
        python-version: ["3.9", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the tool with its test dependencies
        working-directory: tools/${{ matrix.tool }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the test suite
        working-directory: tools/${{ matrix.tool }}
        run: python -m pytest -q

      - name: Smoke test the console script
        working-directory: tools/${{ matrix.tool }}
        run: ${{ matrix.tool }} --version
